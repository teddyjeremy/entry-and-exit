steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build","-t","$LOCATION-docker.pkg.dev/$PROJECT_ID/paper-live/engine:$COMMIT_SHA","paper-live"]
  - name: gcr.io/cloud-builders/docker
    args: ["push","$LOCATION-docker.pkg.dev/$PROJECT_ID/paper-live/engine:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - paper-live-engine
      - --image=$LOCATION-docker.pkg.dev/$PROJECT_ID/paper-live/engine:$COMMIT_SHA
      - --region=$LOCATION
      - --platform=managed
      - --min=1
      - --max=1
      - --no-cpu-throttling
      - --cpu=1
      - --memory=1Gi
      - --concurrency=80
      - --timeout=3600
      - --service-account=paper-live-engine@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,PAPER_MODE=true
      - --set-secrets=HELIUS_API_KEY=helius-api-key:latest,DASHBOARD_API_TOKEN=paper-dashboard-token:latest
      - --no-allow-unauthenticated
images:
  - "$LOCATION-docker.pkg.dev/$PROJECT_ID/paper-live/engine:$COMMIT_SHA"
