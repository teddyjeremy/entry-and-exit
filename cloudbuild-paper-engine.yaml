steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy pump-paper-engine \
          --source=paper-engine \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --min=1 \
          --max=1 \
          --memory=1Gi \
          --cpu=1 \
          --concurrency=10 \
          --timeout=60 \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --set-env-vars="GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
          --set-secrets="PAPER_API_TOKEN=PAPER_API_TOKEN:latest,HELIUS_API_KEY=HELIUS_API_KEY:latest"
substitutions:
  _REGION: us-central1
  _RUNTIME_SERVICE_ACCOUNT: paper-engine-runtime@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
