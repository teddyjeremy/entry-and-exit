name: Paper engine CI
on:
  pull_request:
    paths:
      - "paper-live/**"
      - ".github/workflows/paper-live-ci.yml"
  push:
    branches: [paper-live]
    paths:
      - "paper-live/**"
      - ".github/workflows/paper-live-ci.yml"
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r paper-live/requirements.txt
      - run: python -m unittest discover -s paper-live/tests -v
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-live/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
