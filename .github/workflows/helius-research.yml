name: Helius coin research

on:
  workflow_dispatch:
    inputs:
      pages_per_mint:
        description: Maximum new Helius history pages to collect per configured mint
        required: false
        default: "10"
      cohort_date:
        description: UTC launch date (YYYY-MM-DD)
        required: false
        default: "2026-11-10"
      cohort_hour_utc:
        description: UTC launch hour (0-23)
        required: false
        default: "0"
  push:
    paths:
      - "config/mints.json"
      - "hourly_cohort.py"
      - ".github/workflows/helius-research.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: helius-coin-research
  cancel-in-progress: false

jobs:
  collect:
    # The legacy configured-mint collector must not run on manual hourly
    # dispatches or when only the hourly pipeline is changed.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && (contains(join(github.event.commits.*.modified, ','), 'config/mints.json') || contains(join(github.event.commits.*.added, ','), 'config/mints.json')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect configured Helius research
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PAGES_PER_MINT: ${{ github.event.inputs.pages_per_mint || '10' }}
        run: python collector.py

      - name: Commit resumable configured data and checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new research data to commit."
          else
            git commit -m "Add Helius coin research data"
            git push
          fi

      - name: Upload configured research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: helius-research-data
          path: data/
          if-no-files-found: error
          retention-days: 30

  hourly-cohort:
    # This workflow is path-filtered above. Run the hourly pipeline for changes
    # to its own script/workflow, but not for a config/mints-only change.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(join(github.event.commits.*.modified, ','), 'hourly_cohort.py') || contains(join(github.event.commits.*.added, ','), 'hourly_cohort.py') || contains(join(github.event.commits.*.modified, ','), '.github/workflows/helius-research.yml') || contains(join(github.event.commits.*.added, ','), '.github/workflows/helius-research.yml')))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate hourly cohort settings
        env:
          COHORT_DATE: ${{ github.event.inputs.cohort_date || '2026-11-10' }}
          COHORT_HOUR_UTC: ${{ github.event.inputs.cohort_hour_utc || '0' }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          datetime.strptime(os.environ["COHORT_DATE"], "%Y-%m-%d")
          hour = int(os.environ["COHORT_HOUR_UTC"])
          if not 0 <= hour <= 23:
              raise SystemExit("COHORT_HOUR_UTC must be 0..23")
          print(f"Running {os.environ['COHORT_DATE']} hour {hour:02d}:00- {(hour + 1) % 24:02d}:00 UTC")
          PY

      - name: Screen UTC launch hour and collect bounded Helius history
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          COHORT_DATE: ${{ github.event.inputs.cohort_date || '2026-11-10' }}
          COHORT_HOUR_UTC: ${{ github.event.inputs.cohort_hour_utc || '0' }}
          MAX_PAGES_PER_ADDRESS: "20"
        run: python hourly_cohort.py

      - name: Upload hourly cohort and coin evidence
        uses: actions/upload-artifact@v4
        with:
          name: hourly-cohort-${{ github.event.inputs.cohort_date || '2026-11-10' }}-${{ github.event.inputs.cohort_hour_utc || '0' }}-utc
          path: data/hourly/
          if-no-files-found: error
          retention-days: 30
