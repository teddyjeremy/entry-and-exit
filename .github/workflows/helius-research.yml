name: Helius coin research

on:
  workflow_dispatch:
    inputs:
      cohort_date:
        description: UTC launch date (YYYY-MM-DD)
        required: false
        default: "2026-11-10"
      cohort_hour_utc:
        description: UTC launch hour (0-23)
        required: false
        default: "0"
  push:
    paths:
      - "hourly_cohort.py"
      - ".github/workflows/helius-research.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: helius-coin-research
  cancel-in-progress: false

jobs:
  # The configured-mint collector is now schedule-only. It cannot consume
  # Helius quota when the hourly cohort is dispatched or its code is updated.
  collect:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect configured Helius research
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PAGES_PER_MINT: "10"
        run: python collector.py

      - name: Commit resumable configured data and checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new research data to commit."
          else
            git commit -m "Add Helius coin research data"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload configured research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: helius-research-data
          path: data/
          if-no-files-found: error
          retention-days: 30

  # Pushes to either path above and manual dispatches always execute this job.
  # No fragile commit-message/path expression is needed here.
  hourly-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate hourly cohort settings
        env:
          COHORT_DATE: ${{ github.event.inputs.cohort_date || '2026-11-10' }}
          COHORT_HOUR_UTC: ${{ github.event.inputs.cohort_hour_utc || '0' }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          datetime.strptime(os.environ["COHORT_DATE"], "%Y-%m-%d")
          hour = int(os.environ["COHORT_HOUR_UTC"])
          if not 0 <= hour <= 23:
              raise SystemExit("COHORT_HOUR_UTC must be 0..23")
          print(f"Running {os.environ['COHORT_DATE']} hour {hour:02d}:00 UTC cohort")
          PY

      - name: Screen UTC launch hour and collect bounded Helius history
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          COHORT_DATE: ${{ github.event.inputs.cohort_date || '2026-11-10' }}
          COHORT_HOUR_UTC: ${{ github.event.inputs.cohort_hour_utc || '0' }}
          MAX_PAGES_PER_ADDRESS: "20"
        run: python hourly_cohort.py

      - name: Upload hourly cohort and coin evidence
        uses: actions/upload-artifact@v4
        with:
          name: hourly-cohort-${{ github.event.inputs.cohort_date || '2026-11-10' }}-${{ github.event.inputs.cohort_hour_utc || '0' }}-utc
          path: data/hourly/
          if-no-files-found: error
          retention-days: 30
