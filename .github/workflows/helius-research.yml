name: Helius coin research

on:
  workflow_dispatch:
    inputs:
      cohort_date:
        description: UTC launch date (YYYY-MM-DD)
        required: false
        default: "2026-11-10"
      cohort_hour_utc:
        description: UTC launch hour (0-23)
        required: false
        default: "0"
      repair_incomplete:
        description: Resume histories marked incomplete and then decode the cohort
        required: false
        type: boolean
        default: true
  push:
    paths:
      - "hourly_cohort.py"
  pull_request:
    paths:
      - "hourly_cohort.py"
      - "analyze_hourly_cohort.py"
      - "tests/**"
      - ".github/workflows/helius-research.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: helius-coin-research
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile and test research scripts
        run: |
          python -m py_compile hourly_cohort.py analyze_hourly_cohort.py
          python -m unittest discover -s tests -v

  collect:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync latest main before resuming any queued run
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Collect configured Helius research
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PAGES_PER_MINT: "10"
        run: python collector.py
      - name: Commit configured research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Add Helius coin research data"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload configured research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: helius-research-data
          path: data/
          if-no-files-found: error
          retention-days: 30

  hourly-cohort:
    # The collector commits checkpointed data directly to main. Do not run
    # this job on feature branches or it could bypass the PR by pushing to main.
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test decoder and compile research scripts
        run: |
          python -m py_compile hourly_cohort.py analyze_hourly_cohort.py
          python -m unittest discover -s tests -v
      - name: Validate cohort settings
        env:
          COHORT_DATE: ${{ github.event.inputs.cohort_date || '2026-11-10' }}
          COHORT_HOUR_UTC: ${{ github.event.inputs.cohort_hour_utc || '0' }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          datetime.strptime(os.environ["COHORT_DATE"], "%Y-%m-%d")
          hour = int(os.environ["COHORT_HOUR_UTC"])
          if not 0 <= hour <= 23:
              raise SystemExit("COHORT_HOUR_UTC must be 0..23")
          PY
      - name: Sync latest main before collecting
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Collect in small resumable batches and persist each checkpoint
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          COHORT_DATE: ${{ github.event.inputs.cohort_date || '2026-11-10' }}
          COHORT_HOUR_UTC: ${{ github.event.inputs.cohort_hour_utc || '0' }}
          MAX_PAGES_PER_ADDRESS: "20"
          BATCH_SIZE: "5"
          REPAIR_INCOMPLETE: ${{ github.event.inputs.repair_incomplete || '1' }}
          MIN_BUYERS_10S: "5"
          MAX_BUNDLE_SHARE: "0.20"
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while true; do
            # Always resume from the latest committed checkpoint before processing a batch.
            git fetch origin main
            git reset --hard origin/main
            set +e
            python hourly_cohort.py
            rc=$?
            set -e
            git add "data/hourly/"
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint hourly cohort collection"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
            if [ "$rc" -eq 75 ]; then
              echo "Helius is still rate-limiting requests; pausing 180 seconds before resuming from the committed cursor."
              sleep 180
              continue
            fi
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ]; then
              exit "$rc"
            fi
            if [ "$rc" -eq 0 ]; then
              break
            fi
          done
      - name: Decode raw token flows and produce cohort audit
        env:
          COHORT_DATE: ${{ github.event.inputs.cohort_date || '2026-11-10' }}
          COHORT_HOUR_UTC: ${{ github.event.inputs.cohort_hour_utc || '0' }}
        run: python analyze_hourly_cohort.py
      - name: Upload completed hourly cohort snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hourly-cohort-${{ github.event.inputs.cohort_date || '2026-11-10' }}-${{ github.event.inputs.cohort_hour_utc || '0' }}-utc
          path: data/hourly/
          if-no-files-found: error
          retention-days: 30
