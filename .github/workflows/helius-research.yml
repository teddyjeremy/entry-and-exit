name: Helius coin research

on:
  workflow_dispatch:
    inputs:
      pages_per_mint:
        description: Maximum new Helius history pages to collect per mint in this run
        required: false
        default: "10"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: helius-coin-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Helius data
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PAGES_PER_MINT: ${{ github.event.inputs.pages_per_mint || '10' }}
        run: python collector.py

      - name: Commit resumable data and checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new research data to commit."
          else
            git commit -m "Add Helius coin research data"
            git push
          fi

      - name: Upload research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: helius-research-data
          path: data/
          if-no-files-found: error
          retention-days: 30
